# Stackage snapshot pinning GHC and every library version.
# LTS 24.x ships GHC 9.10 and hakyll 4.16.x; see https://www.stackage.org/lts
resolver: lts-24.57

packages:
- .

# hakyll and its dependencies are all part of the snapshot, so no extra-deps
# are needed. Add entries here only when pulling a package that is not in LTS.
extra-deps: []
