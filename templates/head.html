<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>$if(page_title)$$page_title$ &middot; $blog_title$$else$$blog_title$$endif$</title>
$if(blog_description)$
  <meta name="description" content="$blog_description$">
$endif$
  <link rel="canonical" href="$canonical_url$">
  <link rel="alternate" type="application/atom+xml" title="$blog_title$" href="/rss/feed.xml">
  <link rel="icon" href="/favicon.ico">
$if(google_site_verification)$
  <meta name="google-site-verification" content="$google_site_verification$">
$endif$

  <meta property="og:title" content="$if(page_title)$$page_title$$else$$blog_title$$endif$">
  <meta property="og:type" content="$if(og_type)$$og_type$$else$website$endif$">
  <meta property="og:url" content="$canonical_url$">
  <meta property="og:site_name" content="$blog_title$">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;500&family=Noto+Sans+TC:wght@300;400;500&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/purecss@1.0.1/build/pure-min.css" integrity="sha384-oAOxQR6DkCoMliIh8yFnu25d7Eq/PHS21PClpwjOTeU2jRSq11vu66rf90/cZr47" crossorigin="anonymous">
  <link rel="stylesheet" href="/stylesheets/customize.css">
$if(mathjax)$
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
$endif$
$if(blog_google_analytics_id)$
  <script async src="https://www.googletagmanager.com/gtag/js?id=$blog_google_analytics_id$"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', '$blog_google_analytics_id$');
  </script>
$endif$
</head>
